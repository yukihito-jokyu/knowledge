interfaces_and_contracts:
  - Codex会話は一件の絶対技術記事URLを入力とし、成功時はReading Value Assessment Markdown、失敗時は設計済みの停止理由を返す。専用CLI/API/UIは作らない。
  - Article AnalysisはArticle Claim ID、Claim、Role、Importance、Location、Support、該当時のscope、target version、temporal context、content_limitations、Claim Reconciliationを提供する。評価可能なClaimがない場合はarticle_not_evaluableとして停止し、推奨を作らない。
  - 記事取得は初期URL・全redirect・解決先を接続前に検査し、検査済みIPだけへ固定接続する。再名前解決、認証、Cookie、状態変更は許可しない。
  - 各Article Claimは既存skills/knowledge-search/へ渡し、正常なAssessmentとSearch Traceを受ける。technical_failureまたはcanceledは推奨に変換せず停止する。
  - Assessment MapはClaim ID、Assessment reference、Trace referenceを一対一で保持する。最終出力のAssessment basisはこのMapを参照する。
  - 記事再調査は最大二回で、Claim本文・scope・target version・temporal contextの全一致だけ既存Assessmentを再利用する。

