out_of_scope:
  - Knowledge CLIのcmd/、internal/、SQLite schema・migration、公開CLI JSON、公開設定の追加・変更。
  - skills/knowledge-search/の探索戦略、状態分類、Budget、記事取得、推奨機能の変更。
  - Article本文の永続アーカイブ、認証済みサイト・状態変更を伴う取得、一般的な記事品質ランキング。
  - ConversationまたはTask EpisodeからのEvidence候補抽出・知識更新（FEAT-004）。
  - Scenario A〜Jをまたぐ横断Fixture評価基盤（FEAT-005）。

implementation_notes:
  - 親リポジトリでskills/reading-value/を新設し、TASK-003-01からTASK-003-03の順に記事取得・分析、評価統合・推奨、検証を積み上げる。
  - 既存skills/knowledge-search/は依存先であり、FEAT-003はそこで返るAssessment／Trace契約を消費する。
  - 上記の固定済み配置以外の実装組織化、symbol、フレームワーク、ライブラリはImplementation領域で既存基盤に従って決める。ただし会話I/O、IP固定、Claim照合、再調査上限、失敗伝播、公開契約非変更は変更しない。
