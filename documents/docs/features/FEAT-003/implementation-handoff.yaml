  items:
    - path: skills/reading-value/SKILL.md
      responsibility: URL一件の会話入力から記事分析、Claim評価、Markdown推奨までを統合するWorkflow。
    - path: skills/reading-value/references/article-analysis.md
      responsibility: 公開URL検査、検査済みIP固定、redirect、本文成立性、Article Claim、再調査照合の契約。
    - path: skills/reading-value/references/reading-value.md
      responsibility: Assessment Map、再利用／無効化、読書推奨、最終Markdown出力の契約。
    - path: skills/reading-value/references/verification.md
      responsibility: 通常、失敗、再調査、安全境界の受入検証契約。
  dependency:
    path: skills/knowledge-search/
    responsibility: ClaimごとのKnowledge AssessmentとSearch Traceを返す既存Workflow。
