tasks:
  - id: TASK-003-01
    title: 安全な記事取得とArticle Analysisを実現する
    logical_area: "Codex workflow: article acquisition / analysis"
    depends_on: []
  - id: TASK-003-02
    title: Claim評価統合・再調査・読書推奨を実現する
    logical_area: "Codex workflow: assessment orchestration / recommendation"
    depends_on:
      - TASK-003-01
      - FEAT-002 implementation handoff
  - id: TASK-003-03
    title: Reading Value Workflowの受入・安全境界を検証する
    logical_area: verification
    depends_on:
      - TASK-003-01
      - TASK-003-02

acceptance_criteria:
  - Codex会話で一件の技術記事URLを受け、Article Claimとその位置・支援根拠を作成する。新しいCLI/API/UI、DB、公開設定を追加しない。
  - URLと全redirectは接続前に公開HTTP(S)の既定port・userinfoなし・公開到達可能解決先として検査し、検査済みIPへ接続先を固定して再名前解決しない。保証不能時はarticle_unavailableで停止する。
  - Claim IDごとに正常Assessment一件とSearch Trace一件をAssessment Mapで追跡でき、技術失敗または中断Claimを含む場合はReading Value Assessmentを出力しない。
  - 利用者固有の既知／未知、推論可能性、Claim重要度、支援根拠だけからread_full、read_selected、skipを決定する。
  - 記事再調査は合計二回までとし、Claim、scope、target version、temporal contextがすべて同一のClaimだけAssessmentを再利用する。changed／addedは再評価し、removedは除外する。
  - 本文またはClaim根拠が不足する記事、内部宛先・不適格redirect・DNS再解決の危険がある記事はarticle_unavailableとして部分評価せず停止する。評価可能なClaimを抽出できない記事はarticle_not_evaluableとして停止する。非Claim要素だけの欠落はcontent_limitationsとして明示できる。
  - 通常・失敗・再調査・安全境界をfixtureで再現し、Knowledge CLIの公開CLI JSON、SQLite migration、cmd/、internal/、公開設定が変更されないことを確認する。

constraints:
  - 実装本体は親リポジトリのskills/reading-value/にのみ新設する。documents/docs/features/FEAT-003/は設計・handoffの正規資料である。
  - 既存skills/knowledge-search/はClaim単位のAssessment／Traceを返す依存先としてのみ利用し、記事取得・推奨を追加しない。
  - 記事取得はDEC-FEAT-012に従い、検査済みIPへの固定と接続時の再名前解決禁止を保証できる能力だけを使う。保証不能ならarticle_unavailableで停止する。
  - Assessment Mapと最終推奨はClaim IDを唯一の結合キーとし、自由文の推測によってAssessmentやTraceを結び直さない。
  - 記事再調査の合計上限は二回であり、Knowledge Assessmentの再実行は記事再調査回数を消費しない。
  - 実装Taskは承認済みの配置以外のfile path、symbol、framework API、ライブラリ固有の構造を指示しない。

