  - kind: human_design_review
    source: .ai/workflow/state.yaml#features.FEAT-005.human_design_review

out_of_scope:
  - Knowledge CLIのcmd/knowledge/、internal/、SQLite schema・migration、公開CLI JSON、公開設定の追加・変更。
  - 外部記事サイトへのライブアクセス、実ユーザー情報、性能ベンチマーク、一般的な記事品質評価。
  - 検索・Evidence分類・更新・Reading Valueの業務規則を変更すること。
  - Fixture外の自動再実行、補償削除、再開ledger、製品UI/APIの追加。

implementation_notes:
  - TASK-005-01でcase IDと隔離Fixtureを固定し、TASK-005-02とTASK-005-03が責務境界ごとのoracleを消費し、TASK-005-04でプロセス境界の横断受入を完成する。
  - 固定済みの配置以外の実装組織化、symbol、フレームワーク、ライブラリはImplementation領域で既存基盤に従って決める。
  - Goを変更する実装ではgofmt、go test ./...、go vet ./...を実行する。CLI／SQLiteを観測するcaseはtest/integration/の実プロセス境界で検証する。
  - 配置修正後に独立設計レビュー、利用者承認、実装可能性レビューを再実施するまで、handoffをreadyにしない。
