  - integration verification

tasks:
  - id: TASK-005-01
    title: 固定受入Fixtureと隔離Store契約を提供する
    logical_area: fixture / test data
    depends_on:
      - FEAT-001 implementation handoff
      - FEAT-002 implementation handoff
      - FEAT-003 implementation handoff
      - FEAT-004 implementation handoff
  - id: TASK-005-02
    title: Knowledge Searchの層別oracleとReading Value参照を検証する
    logical_area: "workflow verification: search / contract reference"
    depends_on:
      - TASK-005-01
  - id: TASK-005-03
    title: Knowledge AcquisitionとKnowledge Updateの層別oracleを検証する
    logical_area: "workflow verification: acquisition / update"
    depends_on:
      - TASK-005-01
  - id: TASK-005-04
    title: プロセス境界の横断受入suiteと診断を完成する
    logical_area: integration verification
    depends_on:
      - TASK-005-02
      - TASK-005-03

acceptance_criteria:
  - Scenario A〜Jおよび派生Xを、固定case ID、合成入力、隔離Store、期待oracle、期待Store差分で再現可能に実行する。
  - CLI／Store、Knowledge Search、Knowledge Acquisition、Knowledge Update、End-to-Endの成果物を層別に照合し、最初の不一致層と未実行層を記録する。A／G／I／JはFEAT-003の指定節への参照完全性だけを確認する。
  - F／GではCandidate、Decision、CLI mutation、Store差分がなく、Hでは訂正前のEvidence・revision・Relationを保持して訂正後のEvidence・revisionを追加する。
  - A〜E、H、I、Jでは既存Search Trace契約を確認し、A／G／I／Jの`reading_value_reference`がFEAT-003の指定節へ一意に遡れることを確認する。
  - 技術失敗Xと中断Xを実CLIプロセス境界で確認し、成功のAssessment／推奨へ変換せず後続を実行しない。
  - 新しい製品公開契約、CLI operation、DB schema、migration、公開設定を追加・変更しない。

constraints:
  - Fixtureはテスト専用であり、実ユーザーStore、外部記事、認証情報、既定Store、共有Storeを使用しない。
  - Caseの入力、seed、oracle、Store差分はdocs/features/FEAT-005/design/scenario-catalog.mdを正とし、実装の都合で変更しない。
  - 既存CLIとWorkflowを消費・観測するだけで、検索・更新・推奨の業務規則を変更しない。Workflow Skill自体も変更しない。
  - 実装Taskは承認済みの配置以外のfile path、symbol、framework API、ライブラリ固有の構造を指示しない。

decisions:
  - id: DEC-FEAT-016
    source: docs/features/FEAT-005/decisions/DEC-FEAT-016.md

interfaces_and_contracts:
  - Fixtureはcase ID、固定入力、Store seed、期待層別oracle、期待Store差分、契約参照を持ち、単層実行とEnd-to-End実行は同じcase IDを共有する。
  - Case Resultは照合順に最初の不一致層、根拠参照、後続未実行層またはnot_run理由を記録する。
  - CLI／Storeのargv、stdout、stderr、exit code、実行順、mutation数、履歴差分は既存FEAT-001公開契約を観測する。
  - Search／Trace、Candidate／Update ResultはFEAT-002およびFEAT-004の既存契約を観測する。A／G／I／JのReading ValueはFEAT-003の指定節を参照するだけで、実行結果を観測しない。

contract_artifacts:
  - kind: feature_design
    source: docs/features/FEAT-005/design.md
  - kind: scenario_catalog
    source: docs/features/FEAT-005/design/scenario-catalog.md
  - kind: existing_cli_contract
    source: docs/features/FEAT-001/design/command-catalog.md
  - kind: existing_cli_operations
    source: docs/features/FEAT-001/design/commands/
  - kind: search_trace_contract
