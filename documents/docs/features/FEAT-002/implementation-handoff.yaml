out_of_scope:
  - Article URL取得、Claim分解、記事内の重要度・根拠・位置の判断、Reading Value評価（FEAT-003）。
  - ConversationまたはTask EpisodeからのEvidence候補抽出・知識更新（FEAT-004）。
  - Scenario A〜Jをまたぐ横断Fixture評価基盤（FEAT-005）。
  - Semantic Search、Embedding、Vector Index（FEAT-006）。
  - Knowledge CLIの操作、JSON wire schema、SQLite schema、公開設定、Assessment/Trace永続化の追加・変更。

implementation_notes:
  - FEAT-001のimplementation handoffがreadyであることを前提に、公開済みCLI契約を変更せず利用する。
  - Task-002-01からTask-002-03の順序で、探索・判定、成果物/失敗境界、横断検証を積み上げる。
  - 実装組織化、ファイル配置、symbol、フレームワーク選択はImplementation領域で既存基盤に従って決める。ただし、設計済みの状態分類、Budget、CLI呼出し条件、成果物構造、失敗/中断の振る舞いは変更しない。
