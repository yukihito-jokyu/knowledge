  - id: DEC-FEAT-006
    source: docs/features/FEAT-001/decisions/DEC-FEAT-006.md

interfaces_and_contracts:
  - Article Analysisまたは呼出側は、一つの独立評価可能なTarget Claimと明示されたScope・時点文脈だけを渡す。
  - Knowledge Searchは既存CLIのsearch-text、search-concept、get、get-evidence、search-related、search-contradictions、search-temporalだけを利用する。
  - 既存CLIの名前付きoption、success/error JSON、stdout/stderr、exit code契約はFEAT-001資料どおりに扱う。
  - Assessmentは一つの状態、Confidence、Known、Knowledge Gap、Supporting Evidence、Relation、矛盾、時点差分、結論、Trace参照を持つMarkdown成果物である。
  - Search Traceは各操作、最小限の入力要約、結果/Evidence ID、増分、Budget、停止理由を持つ別Markdown成果物である。
  - validation_error、not_found、storage_error、internal_error、JSONプロトコル不整合はtechnical_failureで停止する。response開始前のexit 130・無出力はcanceledで中断を伝播する。

