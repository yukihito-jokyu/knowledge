      - TASK-002-02

acceptance_criteria:
  - Claimを直接探索から必要最小限の構成要素、Concept、Relation、Evidence、矛盾、時点差分へ拡張し、Evidenceに基づき一つの評価状態へ到達する。
  - known、partially_known、inferable、contradicted、outdated、no_evidence、uncertainを直接性、完全性、Evidence強度、Scope、時点で区別する。
  - 未観測を未知と断定せず、Relationまたは候補類似だけを理解の根拠にしない。
  - 最大12 CLI呼出し、探索4回、補助探索4回、Evidence取得4回、Relation深さ1、矛盾・時点探索合計2回を超えない。
  - AssessmentとSearch TraceをMarkdownで分離し、Traceから探索・Budget・停止理由・Evidence IDを追跡できる。
  - CLIの技術失敗はAssessmentなしでtechnical_failureとして、exit 130・無出力はerror codeなしのcanceledとしてParentへ伝播する。

constraints:
  - Knowledge CLIの既存11操作をそのまま消費し、新しいCLI operation、JSON wire schema、SQLite migration、公開Budget設定を追加・変更しない。
  - CLIは決定論的な検索・取得だけを担い、Claimの意味、検索戦略、Evidence強度、状態判定はCodex Knowledge Searchが担う。
  - DEC-REQ-001によりsearch-semantic、Embedding、Vector Indexを初期提供で利用しない。
  - AssessmentとTraceは初期提供では永続化せず、TraceにEvidence原文を不要に複製しない。
  - 実装Taskはファイルパス、symbol、framework API、ライブラリ固有の構造を指示しない。

decisions:
