interfaces_and_contracts:
  - knowledge [--store <absolute-path>] <operation> [operation options]
  - --store is optional, appears once before operation, and never appears in success JSON.
  - Invalid store input emits validation_error to stderr and exits 2 before opening a Store.
  - A selected Store's create/open/migration error emits storage_error to stderr and exits 1 without fallback.
  - The default Store remains os.UserConfigDir()/knowledge/knowledge.db only when --store is absent.
  - Verification-only Skills copy the ordered roots reading-value, knowledge-acquisition, knowledge-search, and knowledge-update; they derive verification/knowledge.db from the opened verification workspace's pwd -P plus required markers and pass it as explicit argv for every invocation.

