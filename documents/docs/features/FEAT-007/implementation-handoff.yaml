out_of_scope:
  - 既定Storeの移動、環境変数・設定ファイル、権限昇格、同期・共有・remote Store。
  - SQLite schema、migration asset、domain I/O、既存11operation固有JSON schemaの変更。

implementation_notes:
  - 公開CLI、Store、error、migrationの実装はimpl-knowledge-cli Skillを使用する。
  - root Skillsの変更はimpl-knowledge-workflow Skillを使用する。
  - verification/の追従は、review/auditがPASSしたclean CLI source commit、candidate fingerprint、source inventory/fingerprintと不変Review/Audit Reportを固定して隔離worktreeでbuildする。Skillコピーはworkflow writerが検証した別のclean workflow source commitと対象root/fingerprintから得る。manifest、report、binary、Skillコピーを同一の専用branch commitに置き、Featureブランチと混在させない。Issue #233はこの同期reportと人間専用Runtime受入の状態が揃うまでfinalizeしない。
  - Codex Runtime受入はAIが実行しない。利用者が会話記録、各CLI invocationのargv記録、verification/knowledge.dbの事後状態、既定Storeへfallbackしなかった確認を提示した場合だけ評価する。未提示なら未実行である。
  - 実装後は独立コードレビューとaudit-knowledge-cli-conformanceによる最終整合性監査を完了する。

