acceptance_criteria:
  - 全11operationは明示された一つの絶対Storeを利用し、指定なし時は既定Storeを維持する。
  - 不正なStore指定はvalidation_error/exit 2、指定Storeのopen/migration失敗はfallbackなしのstorage_error/exit 1となる。
  - success JSON、既存operation固有I/O、schema/migration asset、Ctrl-C規約を変更しない。
  - 通常Skillは既定Storeのままであり、検証用`reading-value`、`knowledge-acquisition`、`knowledge-search`、`knowledge-update`の4 rootは、利用者が開いた`verification/` workspaceの`pwd -P`とmarker確認から同じ隔離Storeを全CLI呼出しへ渡す。
  - review/audit PASS済みで実装branchへcommitされたclean CLI candidateのcommit/candidate fingerprint/source inventory・fingerprint、同candidateに一致する不変Review/Audit Report全文から隔離worktreeで生成したbinaryと、workflow writerが検証・commitしたclean workflow source/root fingerprintからのSkillコピーだけを専用検証ブランチへ同期する。
  - 実プロセス、全11operation、Go共通検査、利用者実行のRuntime workflowで契約を確認できる。

constraints:
  - global --storeはoperation前に一度だけ置く絶対パスである。
  - 指定Storeの失敗時に別Store、環境変数、設定ファイル、権限昇格を使わない。
  - verification専用Skillが使用できるworkspace起点は、利用者が開いた固定`verification/`の`pwd -P`だけである。`.agents/skills/reading-value/`と`bin/knowledge`がroot直下にない場合は停止し、任意CWD・親探索・利用者追加入力で補正しない。
  - verification/の追従変更はchore/verification-environmentブランチに限定し、PASS済みReview/Audit Report全文をverification/evidence/<cli-source-commit>/へ不変保存する。source-manifest.jsonでCLI source commit、candidate_fingerprint.py --jsonの完全出力、source inventoryの順序付きroot一覧とsource_fingerprint.py出力、workflow source commit/root/fingerprint、各Reportのpath/SHA-256/verdict/source commit/candidate ID、binary/Skill pathごとのSHA-256を記録する。report本文・manifest・CLI fingerprintの不一致は停止する。manifest自身のhashと同期commitは記録せず、同期Git commitと履歴で確定する。
  - 実装Taskは承認済み設計を超える公開契約を追加しない。

