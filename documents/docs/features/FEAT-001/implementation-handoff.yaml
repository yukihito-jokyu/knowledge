interfaces_and_contracts:
  - Knowledge CLI is the only direct writer to the local SQLite Knowledge Store.
  - All v1 operations use named options; successful JSON is written to stdout and error JSON to stderr.
  - The common envelope, error codes, exit codes, null/omission and array semantics are fixed by the approved design.
  - The v1 operation catalog is search-text, search-concept, search-related, get, get-evidence, search-contradictions, search-temporal, create, attach-evidence, revise, and supersede.
  - Lexical search is the initial search capability; semantic search is not a v1 operation.
  - search-contradictions returns selector-matched seed, opposite Assertion target, and stored direction; contradicts endpoints are Assertion-to-Assertion only.
  - The normal binary resolves one OS-standard user configuration directory Store at `knowledge/knowledge.db`; callers cannot select another Store through a public option, environment variable, or configuration file.
  - A first Ctrl-C observed before response writing cancels the one request context across all layers and exits 130 with no JSON and empty stdout/stderr; output already started is not retracted.

