out_of_scope:
  - search-semantic, local embedding execution, and vector index implementation (FEAT-006).
  - Query generation, search continuation or stopping, semantic equivalence, Evidence value or strength evaluation, and Knowledge Assessment.
  - Article Claim decomposition, reading-value evaluation, conversation-derived Evidence candidate extraction.
  - Store location selection, configuration, encryption, backup, synchronization, collaboration, remote sharing, and remote connections. The DEC-FEAT-005 default Store and initial migration are in scope.

implementation_notes:
  - Use the operation documents as the sole detailed source for each option, JSON field, validation branch, flowchart, sequence, SQL processing, and transaction boundary.
  - Preserve the approved public v1 contract; implementation may choose internal code organization without adding public behavior.
  - Implement the approved Go responsibility boundaries: process entry composes application and SQLite persistence; application is transport- and SQLite-driver-independent; domain has no external I/O dependency; SQLite persistence owns SQL, migrations, and lexical derived index.
  - Resolve and initialize the DEC-FEAT-005 default Store only in the process composition root. For process tests, isolate the OS-standard user configuration directory environment to a per-test temporary location and run the normal composition; do not add a public Store override.
  - Create one request Context from the first OS interrupt at the process entry and preserve it through composition, application, domain ports, and SQLite. Check cancellation around Context-free Store setup and immediately before response writing; a cancellation observed before response writing emits no JSON and exits 130, and a mutation transaction must not commit.
  - For process cancellation tests only, compile an `integrationtest`-tagged non-public synchronization gate that reports migration/read/mutation start and waits for the request Context. It must not alter normal composition or Store resolution, and must not be present as a public option, environment variable, or configuration in ordinary builds. Issue #179 covers the migration/read cases for retrieval only; TASK-001-06/07 must add the mutation case and prove that cancellation leaves the database unchanged before TASK-001-09 is complete.
  - Keep migration assets embedded in the binary and run gofmt, go test ./..., go vet ./..., and go mod tidy as the common Go verification and dependency-management workflow.
  - First establish TASK-001-08's shared fixture and CLI process observation boundary after the common CLI contract, then use it in TASK-001-09 to verify all operations, migration rerun, history, rollback, and contract consistency.
  - Verify the FEAT-001 CLI/Store fixture set before declaring implementation complete, including failure paths and no-partial-update behavior.
  - The cross-feature Scenario A-J and layered evaluation required by NFR-006 are owned by FEAT-005; FEAT-001 supplies deterministic CLI/Store fixtures that it can consume.

