acceptance_criteria:
  - Assertion、Evidence、Concept、Scope、Relation、Temporal Metadataを意味ごとに保存・取得できる。
  - Evidenceがない状態を、ユーザーが知らないという判断へ変換しない。
  - 初期提供の11操作を名前付きoptionで呼び出せ、success JSON、error JSON、stdout/stderr、exit codeが公開契約に一致する。
  - 字句・Concept・Relation・Evidence・矛盾候補・時点差分を決定論的に検索でき、空検索は成功の空配列である。
  - search-contradictionsはseed、常に相手Assertionであるtarget、保存方向directionを返し、contradictsをAssertion間に限定する。
  - create、attach-evidence、revise、supersedeは履歴を失わず、一操作一transactionで成功し、失敗時はrollbackする。
  - mutationとmigrationは現行Assertionの字句派生Indexを同一transactionで維持する。
  - Go 1.26以上の単一Go module、`modernc.org/sqlite`、Go標準`embed`を用いるmigrationが隔離SQLite DBに適用でき、初回適用・再実行・失敗時の原子性を確認できる。
  - 通常ビルドはDEC-FEAT-005のOS標準ユーザー設定ディレクトリ配下の既定Storeを初期化し、保存先の解決・初期化・migration失敗を`storage_error`として観測できる。
  - response開始前に観測した最初のCtrl-Cは要求Contextを全層へ伝播して処理を中断し、JSON・stdout・stderrなし、終了コード130で観測できる。中断されたmutation transactionはcommitしない。
  - v1はsemantic searchを公開せず、将来のローカルEmbedding・Vector Indexを正規データから追加できる。

constraints:
  - Knowledge CLIは決定論的な保存・検索・取得・更新だけを担い、AI agent、意味判断、検索戦略、Knowledge Assessmentを内包しない。
  - StoreはローカルSQLiteであり、Knowledge CLIだけが直接変更する。
  - DEC-FEAT-005の既定Store以外の保存先選択、設定、運用、同期、共有、リモート接続、独立したIndex管理操作を公開契約へ追加しない。
  - 実装Taskはファイルパス、symbol、framework API、library固有の構造を指示しない。
  - Go 1.26以上の単一Go moduleとし、SQLite driverはmodernc.org/sqliteを用いる。CGOまたはC compilerをbuild前提にしない。
  - 実行入口、application、domain、SQLite persistence、migration asset、fixture、integration testの責務・依存方向はInitial Designに従う。
  - migration assetはGo標準embedでバイナリへ同梱し、実行時の外部migrationディレクトリ、保存先option、設定ファイルを追加しない。
  - 共通チェックはgofmt、go test ./...、go vet ./...とし、依存管理はgo.mod/go.sumおよびgo mod tidyで行う。第三者lintは必須化しない。
  - 最初のCtrl-Cは公開optionを追加せず要求Contextをcancelし、response開始前に観測した場合は通常のsuccess/error JSONを出力せず終了コード130で終える。response開始後の既出力は取り消さない（DEC-FEAT-006）。

