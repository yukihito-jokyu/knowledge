acceptance_criteria:
  - URL評価Episodeの許可されたユーザー由来寄与だけをCandidate化し、除外入力にはCandidateもDecisionも作らない。
  - CandidateはEvidence原文、観測時刻、kind、派生strength、Assertion、Scope/Temporal、順序、検索入力を追跡できる。
  - Candidate Assertionを先頭に、訂正Evidenceで引用された完全な旧命題（ある場合のみ）、明示されたConcept・Alias・Identifierを順番に既存search-textへ渡し、Assertion IDを初出順で重複除去する。
  - Codexがcreate、attach-evidence、revise、supersede、skipを選択し、既存CLI契約だけで履歴を保つ。失敗・中断・部分適用・結果不明と後続not_startedをUpdate Resultへ残す。
  - Assessment本文完成後・返却前にAcquisitionとUpdateを同期実行し、更新結果にかかわらず同じ本文を返す。
  - 新しいCLI/API/UI、DB、migration、公開JSON、再開ledgerを追加しない。

constraints:
  - 実装本体は親リポジトリのskills/配下の固定済み配置に限る。documents/docs/features/FEAT-004/は設計・handoffの正規資料である。
  - Evidenceはユーザー由来の原文・kind・observed_atだけを既存CLIへ渡し、記事本文・AI回答・質問だけを保存しない。
  - 既存CLIのsearch-text、get、get-evidence、create、attach-evidence、revise、supersedeだけを消費し、search-semanticは呼ばない。
  - 多操作の後段失敗は補償削除しない。同一episode_idの自動再実行・再開をしない。
  - 実装Taskは承認済みの配置以外のfile path、symbol、framework API、ライブラリ固有の構造を指示しない。

