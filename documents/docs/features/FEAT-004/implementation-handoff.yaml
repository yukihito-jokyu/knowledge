interfaces_and_contracts:
  - Reading ValueはAssessment本文を完成後・返却前にURL評価EpisodeをKnowledge Acquisitionへ渡し、Knowledge Update完了後も同じ本文を返す。
  - Acquisitionはユーザー寄与だけから順序付きCandidate一覧を作り、候補ゼロは空一覧とする。
  - CandidateとUpdate Decision / Resultの必須field、検索列、停止、失敗分類はworkflow-contracts.mdに従う。
  - UpdateはCandidateのsearch_queriesを既存search-textへ一回ずつ渡し、必要時にget / get-evidenceを用い、既存mutationだけを選ぶ。
  - Update Resultは一時Markdown成果物であり、Store、ledger、公開I/Oへ追加保存しない。

