out_of_scope:
  - Knowledge CLIのcmd/knowledge/、internal/、SQLite schema・migration、公開CLI JSON、公開設定の追加・変更。
  - 任意会話・別作業・保存済み履歴の自動取り込み、履歴選択UI、job queue、callback、scheduler、再開ledger。
  - 記事本文、AI回答、閲覧・評価・要約、質問のみをEvidenceとして保存すること。
  - 意味検索、未発見の意味的重複の保証、補償削除。
  - Scenario A〜Jをまたぐ横断Fixture評価基盤（FEAT-005）。

implementation_notes:
  - TASK-004-01からCandidate成果物を固定し、TASK-004-02で既存CLIを消費するUpdateを構築し、TASK-004-03でReading Valueへ同期接続する。
