version: "3"

vars:
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html

tasks:
  lint:
    desc: golangci-lintで静的解析を実行する
    cmds:
      - golangci-lint run ./...

  test:coverage:
    desc: 全パッケージのカバレッジHTMLを生成する
    cmds:
      - go test ./... -count=1 -coverpkg=./... -coverprofile={{.COVERAGE_FILE}}
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
    generates:
      - "{{.COVERAGE_HTML}}"

  test:integration:
    desc: fixture駆動のCLIプロセス境界結合テストを実行する
    cmds:
      - go test ./test/integration -count=1
