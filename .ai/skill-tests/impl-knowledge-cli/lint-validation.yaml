id: impl-knowledge-cli-lint-validation
target_skill: impl-knowledge-cli
scenario: Knowledge CLIの実装とテストを追加した後、完了条件を検証する依頼。
input_summary: Goのunit test、CLI process境界integration test、SQLite adapterを変更したため、実装を完了したい。
expected:
  - gofmt、go test ./...、go vet ./...を実行する。
  - Taskfileで定義されたgolangci-lintをtask lintで実行する。
  - Skillのpackage別100%カバレッジ検査と該当するprocess境界integration testを実行する。
forbidden:
  - go testやgo vetの成功だけでlintを未実行のまま完了とする。
  - lintを理由に承認済みの公開CLI契約を変更する。
  - lintだけを実行してprocess境界integration testを省略する。
related_issue: '#179'
