name: golangci-lint

on:
  pull_request:
    paths:
      - '**/*.go'
  push:
    branches:
      - main
    paths:
      - '**/*.go'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: 複合リテラルの配置を確認する
        run: python3 .agents/skills/impl-knowledge-cli-implementation/scripts/check_composite_literal_layout.py
      - name: テストカバレッジを確認する
        run: python3 .agents/skills/impl-knowledge-cli-implementation/scripts/check_test_coverage.py
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
