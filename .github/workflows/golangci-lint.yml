name: golangci-lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: テストカバレッジを確認する
        run: .agents/skills/impl-knowledge-cli/scripts/check_test_coverage.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
